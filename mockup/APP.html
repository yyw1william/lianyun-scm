<style>

  :root{
    --bg-page:#F4F3F0; --bg-subtle:#EDEBE6; --bg-hover:#E8E6E1;
    --surface:#FFFFFF;
    --text-primary:#141310; --text-secondary:#615E58; --text-tertiary:#8E8B84;
    --line:#E1DFD9; --line-strong:#D4D1C9;
    --accent:#E8671D; --accent-hover:#CF5613; --accent-soft:#FCEDE2;
    --ink:#141310; --ink-soft:#24221F;
    --danger:#C0392B; --warning:#B07A1F; --success:#2E7D5B; --info:#2E5AA8;
    --rail:#131210; --rail-line:#26231F; --rail-text:#A9A59C; --rail-muted:#6F6B63;
    --shadow-1:0 1px 2px rgba(30,26,21,.05);
    --shadow-2:0 14px 36px rgba(30,26,21,.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:'Figtree','SF Pro Text',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    color:var(--text-primary); background:var(--bg-page);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(232,103,29,.22);}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#4A463E; border-radius:999px; border:2px solid var(--rail);}
  ::-webkit-scrollbar-track{background:transparent;}
  .app{display:flex; height:100vh;}
  .sidebar{width:232px; flex-shrink:0; background:var(--rail); color:var(--rail-text); display:flex; flex-direction:column; border-right:1px solid var(--rail-line);}
  .brand{display:flex; align-items:center; gap:12px; padding:22px 18px 16px;}
  .brand-mark{width:36px; height:36px; border-radius:11px; flex-shrink:0; background:linear-gradient(135deg,#E8671D,#F7A37A); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:16px; box-shadow:0 6px 18px rgba(232,103,29,.4), inset 0 1px 0 rgba(255,255,255,.25);}
  .brand-name{color:#F5F4F0; font-size:15px; font-weight:750; letter-spacing:.02em;}
  .brand-sub{font-size:10.5px; color:var(--rail-muted); letter-spacing:.06em; margin-top:1px;}
  .nav{flex:1; overflow-y:auto; padding:4px 12px 16px;}
  .nav-group{font-size:10px; color:var(--rail-muted); letter-spacing:.16em; padding:18px 10px 7px; font-weight:600;}
  .nav-item{display:flex; align-items:center; gap:11px; position:relative; padding:9px 10px; border-radius:9px; margin-bottom:1px; color:var(--rail-text); text-decoration:none; font-size:13.5px; cursor:pointer; transition:background .14s,color .14s;}
  .nav-item:hover{background:#201E1B; color:#F5F4F0;}
  .nav-item.active{background:#26231F; color:#F5F4F0; font-weight:650;}
  .nav-item.active::before{content:""; position:absolute; left:-12px; top:9px; bottom:9px; width:3px; border-radius:2px; background:var(--accent); box-shadow:0 0 10px rgba(232,103,29,.6);}
  .nav-ico{width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; opacity:.92;}
  .nav-ico svg{width:18px; height:18px;}
  .nav-item.active .nav-ico{opacity:1; color:var(--accent);}
  .nav-desc{font-size:10.5px; color:#5F5B53; margin-left:auto; padding-left:8px;}
  .nav-item.active .nav-desc{color:#8B867C;}
  .side-foot{padding:14px 18px; border-top:1px solid var(--rail-line); font-size:11px; color:var(--rail-muted); line-height:1.7;}
  .side-foot b{color:#B7B3AA; font-weight:600;}
  .kbd{display:inline-block; min-width:16px; text-align:center; border:1px solid #3A372F; border-radius:5px; padding:0 4px; font-size:10px; color:#8B867C; margin-right:2px;}
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{height:56px; flex-shrink:0; display:flex; align-items:center; gap:20px; padding:0 26px; background:rgba(244,243,240,.82); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border-bottom:1px solid var(--line); z-index:10;}
  .crumb{font-size:13px; color:var(--text-tertiary); white-space:nowrap;}
  .crumb span{color:#C0BDB5; margin:0 7px;}
  .crumb b{color:var(--text-primary); font-weight:650;}
  .ctx-pills{display:flex; align-items:center; gap:8px; flex:1; overflow:hidden; justify-content:center;}
  .pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; letter-spacing:.01em;}
  .pill.info{background:var(--bg-subtle); color:var(--text-secondary); border:1px solid var(--line);}
  .pill.accent{background:var(--accent-soft); color:var(--accent-hover);}
  .pill.danger{background:#FAE7E3; color:#A33124;}
  .dot{width:6px; height:6px; border-radius:50%; background:currentColor; display:inline-block;}
  .top-actions{display:flex; align-items:center; gap:10px; white-space:nowrap;}
  .btn-reset{border:1px solid var(--line-strong); background:var(--surface); color:var(--text-secondary); border-radius:9px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s;}
  .btn-reset:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .avatar{width:32px; height:32px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,#141310,#3A342C); color:#F5F4F0; font-size:13px; font-weight:650; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(20,19,16,.18);}
  .frame-wrap{flex:1; min-height:0; position:relative;}
  #frame{width:100%; height:100%; border:0; display:block; background:var(--bg-page);}
  #loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg-page); color:var(--text-tertiary); font-size:13px; gap:10px; pointer-events:none; opacity:0; transition:opacity .18s; z-index:5;}
  #loading.show{opacity:1;}
  .spin{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* ---------- 外壳移动端适配 ---------- */
  .hamburger{display:none; width:38px; height:38px; flex-shrink:0; border-radius:10px; align-items:center; justify-content:center; background:var(--bg-subtle); border:1px solid var(--line); cursor:pointer; color:var(--text-primary);}
  .overlay{display:none; position:fixed; inset:0; background:rgba(15,14,12,.45); z-index:55; opacity:0; pointer-events:none; transition:opacity .22s ease;}
  .overlay.show{opacity:1; pointer-events:auto;}
  @media (max-width: 860px){
    .hamburger{display:flex;}
    .overlay{display:block;}
    .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:60; transform:translateX(-105%); transition:transform .24s ease; box-shadow:0 0 44px rgba(0,0,0,.4);}
    .sidebar.open{transform:translateX(0);}
    .brand{padding:18px 14px 14px;}
    .nav{padding:4px 10px 16px;}
    .topbar{height:52px; padding:0 12px; gap:10px;}
    .ctx-pills{display:none;}
    .crumb{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .btn-reset{font-size:12px; padding:6px 10px;}
    .avatar{width:30px; height:30px; font-size:12px;}
    .frame-wrap{min-height:0;}
  }

</style>
</head>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1 工作台 · 链运</title>
<style>
    :root{
    --bg-page:#F4F3F0; --bg-subtle:#EDEBE6; --bg-hover:#E8E6E1;
    --surface:#FFFFFF;
    --text-primary:#141310; --text-secondary:#615E58; --text-tertiary:#8E8B84;
    --line:#E1DFD9; --line-strong:#D4D1C9;
    --accent:#E8671D; --accent-hover:#CF5613; --accent-soft:#FCEDE2;
    --ink:#141310; --ink-soft:#24221F;
    --danger:#C0392B; --warning:#B07A1F; --success:#2E7D5B; --info:#2E5AA8;
    --r-lg:14px; --r-md:9px; --r-sm:6px;
    --shadow-1:0 1px 2px rgba(30,26,21,.05);
    --shadow-2:0 14px 36px rgba(30,26,21,.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text-primary); background:var(--bg-page);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh;}

  /* ---------- 侧边导航 ---------- */
  .sidebar{
    width:220px; flex-shrink:0; border-right:1px solid var(--line);
    padding:24px 16px; background:var(--bg-page); display:flex; flex-direction:column;
  }
  .logo{display:flex; align-items:center; gap:10px; padding:0 8px 20px;}
  .logo-mark{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg,#1D4ED8,#3B82F6);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:14px;
    box-shadow:0 2px 8px rgba(29,78,216,.35);
  }
  .logo-name{font-size:15px; font-weight:600; letter-spacing:.2px;}
  .logo-sub{font-size:11px; color:var(--text-tertiary); margin-top:1px;}
  .nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:10px;

    font-size:14px; color:var(--text-secondary); cursor:pointer;
    transition:background .15s,color .15s;
  }
  .nav-item:hover{background:var(--bg-hover); color:var(--text-primary);}
  .nav-item.active{background:#EEF2FF; color:var(--accent); font-weight:600;}

  /* ---------- 主区 ---------- */

    height:60px; display:flex; align-items:center; justify-content:space-between;

  .crumb{font-size:13px; color:var(--text-secondary);}
  .crumb b{color:var(--text-primary); font-weight:600;}
  .topbar-right{display:flex; align-items:center; gap:16px;}
  .bell{width:34px; height:34px; border-radius:50%; background:var(--bg-subtle); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;}

  .role{font-size:13px; color:var(--text-secondary);}
  .avatar{width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#1D4ED8,#3B82F6); color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center;}

  .content{padding:28px 32px 48px; max-width:1240px; width:100%;}

  .dot.amber{background:#FBBF24; box-shadow:0 0 8px rgba(251,191,36,.8);}
  .dot.green{background:#4ADE80; box-shadow:0 0 8px rgba(74,222,128,.8);}

  .grid{display:grid; grid-template-columns:5fr 7fr; gap:20px; margin-top:20px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;}

  .feed{list-style:none; position:relative;}

  .feed .f-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0;}

(function(){
  var isEmbed = location.search.indexOf('embed')>-1 || location.protocol==='about:';
  if(!isEmbed) return;
  function init(){
    document.body.classList.add('embed');
    document.addEventListener('click', function(e){
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if(!a) return;
      var h = a.getAttribute('href') || '';
      if(h.indexOf('.html')>-1){
        e.preventDefault();
        if(window.parent && window.parent.shellGo){ window.parent.shellGo(h); }
        else location.href = h + (h.indexOf('?')>-1?'&':'?') + 'embed=1';
      }
    });
  }
  if(document.body){ init(); } else { document.addEventListener('DOMContentLoaded', init); }
})();

/* AI 智能录入（演示：规则解析模拟 LLM 结构化输出） */
let aiPrev = null;
function aiExample(){
  document.getElementById('aiText').value='2000台 C28 扫地机器人发美国洛杉矶，9月13日前到港，走整柜，旺季保舱';

function aiParse(){
  const txt=document.getElementById('aiText').value.trim();
  if(!txt){ toast('请先描述需求'); return; }
  const btn=document.getElementById('aiBtn');
  btn.disabled=true; btn.textContent='AI 解析中…';
  setTimeout(()=>{
    aiPrev={qty:document.getElementById('qty').value, sku:document.getElementById('sku').value, port:document.getElementById('port').value, etaDate:document.getElementById('etaDate').value, scene:document.querySelector('input[name=scene]:checked').value};
    const found=[];
    let m=txt.match(/(\d[\d,]*)\s*台/);
    if(m){ document.getElementById('qty').value=m[1].replace(/,/g,''); found.push('数量 '+m[1]+' 台'); }

  document.getElementById('lvQty').textContent=qty.toLocaleString()+' 台';
  document.getElementById('lvVol').textContent=vol.toFixed(0)+' CBM';
  let box,note;

  else{ const n=Math.ceil(vol/68); box='FCL '+n+'×40HQ'; note='💡 '+vol.toFixed(0)+' CBM 远超拼箱合理区间（≤18 CBM），建议整柜'; }

  document.getElementById('lvDays').textContent=days+' 天';

  const w={日常:'30/25/15/10/10/10',旺季:'20/15/40/10/5/10',应急:'20/30/30/10/5/5'}[sc];

}

calc();

<script>
/* 链运 v3 · 单页外壳 embed / srcdoc 模式（DOM 就绪后执行） */
(function(){
  var isEmbed = location.search.indexOf('embed')>-1 || location.protocol==='about:';
  if(!isEmbed) return;
  function init(){
    document.body.classList.add('embed');
    document.addEventListener('click', function(e){
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if(!a) return;
      var h = a.getAttribute('href') || '';
      if(h.indexOf('.html')>-1){
        e.preventDefault();
        if(window.parent && window.parent.shellGo){ window.parent.shellGo(h); }
        else location.href = h + (h.indexOf('?')>-1?'&':'?') + 'embed=1';
      }
    });
  }
  if(document.body){ init(); } else { document.addEventListener('DOMContentLoaded', init); }
})();

/* AI 解析报价单（演示：规则解析模拟 LLM 结构化输出） */
function openAiModal(){ document.getElementById('aiModal').classList.add('show'); }
function closeAiModal(){ document.getElementById('aiModal').classList.remove('show'); }
function aiQuoteExample(){
  document.getElementById('aiQuote').value='货代D 报价（CN → 洛杉矶）\n海运费：$2,300/柜（40HQ）· LCL $38/CBM\n船期：22天\n清关：单清（包税）\n舱位：旺季保舱协议\n理赔：按货值全赔\n备注：免堆期7天';
}
function aiParseQuote(){
  const txt=document.getElementById('aiQuote').value.trim();
  if(!txt){ toast('请先粘贴报价单内容'); return; }
  const btn=document.getElementById('aiQuoteBtn');
  btn.disabled=true; btn.textContent='AI 解析中…';
  setTimeout(()=>{
    if(carriers.length>=10){ toast('候选货代最多 10 家'); btn.disabled=false; btn.textContent='AI 解析并生成报价卡'; closeAiModal(); return; }
    let m=txt.match(/货代([A-Za-z0-9])/);
    let id=LETTERS[seq-4]||('X'+seq);
    let name=m?('货代'+m[1]):('货代'+id);
    let lcl=null, fcl=null;
    m=txt.match(/\$?\s*([\d,]+)\s*\/\s*(?:40HQ|柜)/i); if(m){ fcl=parseInt(m[1].replace(/,/g,'')); }
    m=txt.match(/\$?\s*([\d,]+)\s*\/\s*CBM/i); if(m){ lcl=parseInt(m[1].replace(/,/g,'')); }
    let days=null; m=txt.match(/(\d{1,3})\s*天/); if(m){ days=parseInt(m[1]); }
    let customs='单清（包税）';
    if(/双清/i.test(txt)) customs='双清包税';
    else if(/不包税/i.test(txt)) customs='单清（不包税）';
    else if(/仅清关/i.test(txt)) customs='仅清关';
    let slot='常规订舱';
    if(/保舱/i.test(txt)) slot='旺季保舱（协议）';
    else if(/甩柜/i.test(txt)) slot='旺季可能甩柜';
    let claims='按货值全赔';
    if(/80%|八成/i.test(txt)) claims='按货值80%赔';
    else if(/\$200|200\/件|200美元/i.test(txt)) claims='最高赔$200/件';
    else if(/3倍|三倍/i.test(txt)) claims='按运费3倍赔';
    carriers.push({id:id, name:name, qual:false, lcl:lcl, fcl:fcl, gp:null, days:days, customs:customs, slot:slot, claims:claims, rep:4, ai:true});
    seq++; render(); saveData(); updateBar();
    closeAiModal();
    btn.disabled=false; btn.textContent='AI 解析并生成报价卡';
    toast('AI 已解析「'+name+'」并生成报价卡，请核对补全');
  }, 1100);
}

<div class="modal" id="aiModal">

海运费：$2,300/柜（40HQ）· LCL $38/CBM

<script>
let seq = 4; // 新增卡片编号从 D 开始
let pendingDel = null;
const carriers = [
  {id:'A', name:'货代A', qual:true, lcl:35, fcl:2400, gp:1800, days:21, customs:'单清（包税）', slot:'常规订舱', claims:'按货值全赔', rep:4},
  {id:'B', name:'货代B', qual:true, lcl:40, fcl:2600, gp:2000, days:24, customs:'单清（不包税）', slot:'旺季保舱（协议）', claims:'最高赔$200/件', rep:4},
  {id:'C', name:'货代C', qual:true, lcl:32, fcl:2800, gp:2100, days:26, customs:'单清（包税）', slot:'旺季可能甩柜', claims:'按货值80%赔', rep:5}
];
const OPTS = {
  customs:['双清包税','单清（包税）','单清（不包税）','仅清关'],
  slot:['旺季保舱（协议）','常规订舱','旺季可能甩柜'],
  claims:['按货值全赔','按货值80%赔','最高赔$200/件','按运费3倍赔']
};
const LETTERS='DEFGHIJ';

function opts(k, sel){
  return OPTS[k].map(o=>'<option'+(o===sel?' selected':'')+'>'+o+'</option>').join('');
}
function readyOf(c){
  return !!(c.lcl && c.fcl && c.days && c.customs && c.slot && c.claims && c.rep);
}
function render(){
  const box=document.getElementById('cards');
  let html=carriers.map(c=>{
    const ready=readyOf(c);
    const qualCls=c.qual?'':' warn';
    const qualTxt=c.qual?'✓ 资质通过':'⚠ 资质待核';
    return '<div class="card'+(ready?'':' incomplete')+'" id="card-'+c.id+'">'
      +'<div class="card-head"><div><span class="cname">'+c.name+'</span>'+(c.ai?'<span class="ai-badge-sm">AI</span>':'')+'</div><div style="display:flex;align-items:center;gap:8px;"><span class="qual'+qualCls+'">'+qualTxt+'</span><button class="del" title="删除该货代" onclick="askDel(\''+c.id+'\')">✕</button></div></div>'
      +'<div class="card-body">'
      +'<div class="f-row"><div class="f"><label>LCL（$/CBM）</label><input type="number" value="'+(c.lcl??'')+'" data-c="'+c.id+'" data-k="lcl" oninput="upd(this)"></div><div class="f"><label>40HQ（$/柜）</label><input type="number" value="'+(c.fcl??'')+'" data-c="'+c.id+'" data-k="fcl" oninput="upd(this)"></div></div>'
      +'<div class="f-row"><div class="f"><label>20GP（可选）</label><input type="number" value="'+(c.gp??'')+'" data-c="'+c.id+'" data-k="gp" oninput="upd(this)"></div><div class="f"><label>船期（天）</label><input type="number" value="'+(c.days??'')+'" data-c="'+c.id+'" data-k="days" oninput="upd(this)"></div></div>'
      +'<div class="f"><label>清关服务</label><select data-c="'+c.id+'" data-k="customs" onchange="upd(this)">'+opts('customs',c.customs)+'</select></div>'
      +'<div class="f"><label>舱位保障</label><select data-c="'+c.id+'" data-k="slot" onchange="upd(this)">'+opts('slot',c.slot)+'</select></div>'
      +'<div class="f"><label>理赔条款</label><select data-c="'+c.id+'" data-k="claims" onchange="upd(this)">'+opts('claims',c.claims)+'</select></div>'
      +'<div class="f"><label>履约口碑（1-5）</label><select data-c="'+c.id+'" data-k="rep" onchange="upd(this)">'+[1,2,3,4,5].map(v=>'<option'+(v===(c.rep??4)?' selected':'')+'>'+v+'</option>').join('')+'</select></div>'
      +'<div class="status"><span class="'+(ready?'ok-dot':'bad-dot')+'"></span><span>'+(ready?'报价完整 · 可参与比价':'待补全（缺报价或属性）')+'</span></div>'
      +'</div></div>';
  }).join('');
  box.innerHTML=html;
  updateBar();
}

function upd(el){
  const c=carriers.find(x=>x.id===el.dataset.c);
  const k=el.dataset.k;
  const v=el.type==='number'?(el.value===''?null:Number(el.value)):el.value;
  c[k]=v;
  const card=document.getElementById('card-'+c.id);
  card.classList.toggle('incomplete',!readyOf(c));
  card.querySelector('.status').innerHTML='<span class="'+(readyOf(c)?'ok-dot':'bad-dot')+'"></span><span>'+(readyOf(c)?'报价完整 · 可参与比价':'待补全（缺报价或属性）')+'</span>';
  updateBar();
  saveData();
}

function addCard(){
  if(carriers.length>=10){ toast('候选货代最多 10 家'); return; }
  const id=LETTERS[seq-4]||('X'+seq);
  carriers.push({id:id, name:'货代'+id, qual:false, lcl:null, fcl:null, gp:null, days:null, customs:'单清（包税）', slot:'常规订舱', claims:'按货值全赔', rep:4});
  seq++;
  render();
  saveData();
  toast('已添加 货代'+id+'（空白卡，请补全报价）');
}
function askDel(id){
  pendingDel=id;
  const c=carriers.find(x=>x.id===id);
  document.getElementById('delName').textContent='确定删除「'+c.name+'」？删除后不可恢复，且不参与比价与评分。';
  document.getElementById('delModal').classList.add('show');
}
function closeDel(){ pendingDel=null; document.getElementById('delModal').classList.remove('show'); }
function confirmDel(){
  if(carriers.length<=1){ toast('至少保留 1 家货代'); closeDel(); return; }
  carriers.splice(carriers.findIndex(x=>x.id===pendingDel),1);
  closeDel();
  render();
  saveData();
  toast('已删除该货代，剩余 '+carriers.length+' 家');
}
function updateBar(){
  const ready=carriers.filter(readyOf).length;
  let html='<div class="info" id="actInfo">'+ready+'/'+carriers.length+' 家报价已就绪';
  if(carriers.length<2) html+=' · <b style="color:#B45309;">候选较少（'+carriers.length+'家），建议补充报价后对比更充分</b>';
  else if(ready<carriers.length) html+=' · 未就绪卡片不会进入比价';
  html+='</div>';
  if(carriers.length<2) html+='<div class="warn-line">⚠ 候选仅 '+carriers.length+' 家：货比三家更充分，建议添加至少 2-3 家（点击右上角「＋ 添加货代」）</div>';
  document.getElementById('actionBar').innerHTML=html+'<button class="btn ghost" onclick="toast(\'草稿已保存\')">保存草稿</button><button class="btn primary" id="nextBtn" onclick="goNext()">下一步：比价看板 →</button>';
}
function goNext(){
  const ready=carriers.filter(readyOf).length;
  if(ready<1){ toast('请先补全至少 1 家货代报价'); return; }
  (window.parent&&window.parent.shellGo)?window.parent.shellGo('P4-比价看板-原型.html'):location.href='P4-比价看板-原型.html';
}
function saveData(){ try{ localStorage.setItem('lianyun_carriers', JSON.stringify(carriers)); }catch(e){} }
function loadData(){ try{ const d=localStorage.getItem('lianyun_carriers'); if(d){ const arr=JSON.parse(d); if(Array.isArray(arr)&&arr.length){ carriers.length=0; arr.forEach(c=>carriers.push(c)); seq=carriers.length+1; } } }catch(e){} }
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
loadData();
render();
saveData();
</script>
</body>
</html>
</template>

<script>
const DEFAULTS=[
  {id:'A', name:'货代A', lcl:35, fcl:2400, days:21, customs:'单清（包税）', slot:'常规订舱', claims:'按货值全赔', rep:4},
  {id:'B', name:'货代B', lcl:40, fcl:2600, days:24, customs:'单清（不包税）', slot:'旺季保舱（协议）', claims:'最高赔$200/件', rep:4},
  {id:'C', name:'货代C', lcl:32, fcl:2800, days:26, customs:'单清（包税）', slot:'旺季可能甩柜', claims:'按货值80%赔', rep:5}
];
function loadCarriers(){
  try{ const d=localStorage.getItem('lianyun_carriers'); if(d){ const arr=JSON.parse(d); if(Array.isArray(arr)&&arr.length) return arr; } }catch(e){}
  return DEFAULTS;
}
function loadRequest(){
  try{ const d=localStorage.getItem('lianyun_request'); if(d) return JSON.parse(d); }catch(e){}
  return {qty:2000, port:'洛杉矶 / 长滩', etaDate:'2026-09-13', scene:'日常', days:25, sku:'C28 扫地机器人（带基站）'};
}
const req=loadRequest();
const carriers=loadCarriers().filter(c=>c.lcl&&c.fcl&&c.days);
const qty=req.qty||2000;
const vol=qty*0.12;
const nCont=Math.ceil(vol/68);
const useFcl=vol>18;

document.getElementById('ctxLine').textContent='需求 #REQ-2608-001 · '+req.sku.split('（')[0]+' × '+qty.toLocaleString()+' 台 · '+req.port+' · 期望 ≤'+req.days+' 天到港';
document.getElementById('tabMeta').textContent=qty.toLocaleString()+' 台 · '+vol.toFixed(0)+' CBM · '+(useFcl?'FCL '+nCont+'×40HQ':'LCL');
document.getElementById('advMain').textContent=useFcl?('FCL '+nCont+'×40HQ（'+(nCont*68>=vol?'可装下':'约 '+vol.toFixed(0)+' CBM')+'）'):'LCL 拼箱';
document.getElementById('advSub').textContent=vol.toFixed(1)+' CBM '+(useFcl?'远超拼箱合理区间（≤18 CBM）· 临界点：体积 >18 CBM 走 FCL':'≤ 18 CBM · 建议拼箱（试跑/小批量）')+' · 试跑参考：120 台 = 14.4 CBM → LCL';

function renderTable(){
  const rows=carriers.map(c=>{
    const lclTotal=vol*c.lcl, fclTotal=nCont*c.fcl;
    const per=useFcl?fclTotal/qty:lclTotal/qty;
    return {c:c, lcl:lclTotal, fcl:fclTotal, per:per};
  });
  const minFcl=Math.min(...rows.map(r=>r.fcl));
  const minLcl=Math.min(...rows.map(r=>r.lcl));
  const minPer=Math.min(...rows.map(r=>r.per));
  const bestFclId=rows.find(r=>r.fcl===minFcl).c.id;
  const bestLclId=rows.find(r=>r.lcl===minLcl).c.id;
  let html=rows.map(r=>{
    const note=[];
    if(r.fcl===minFcl) note.push('<span class="best">FCL 最低</span>');
    if(r.lcl===minLcl) note.push('<span class="best">LCL 最低</span>');
    if(bestLclId!==bestFclId && r.c.id===bestLclId) note.push('<span class="warn-tag">LCL 最便宜但 FCL 非最低 ⚠</span>');
    return '<tr>'
      +'<td>'+(r.fcl===minFcl?'<span class="best">':'')+r.c.name+(r.fcl===minFcl?'</span>':'')+'</td>'
      +'<td class="num'+(r.lcl===minLcl?' best':'')+'">$'+r.lcl.toLocaleString()+'</td>'
      +'<td class="num'+(r.fcl===minFcl?' best':'')+'">$'+r.fcl.toLocaleString()+'</td>'
      +'<td><span class="pill green">'+(useFcl?'FCL':'LCL')+'</span></td>'
      +'<td class="num'+(r.per===minPer?' best':'')+'">$'+r.per.toFixed(2)+'/台</td>'
      +'<td>'+note.join(' ')+'</td></tr>';
  }).join('');
  document.getElementById('cmpBody').innerHTML=html;
  document.getElementById('actInfo').innerHTML='共 <b>'+carriers.length+'</b> 家货代参与比价 · 本批推荐 <b>'+(useFcl?'FCL':'LCL')+'</b> · 单件最低 $'+minPer.toFixed(2)+'/台（'+rows.find(r=>r.per===minPer).c.name+'）';
}
renderTable();
/* AI 对比结论（真实报价 + 全链路成本） */
(function aiCompare(){
  const rows=carriers.map(c=>{ const lclTotal=vol*c.lcl, fclTotal=nCont*c.fcl; return {c:c, lcl:lclTotal, fcl:fclTotal, per:useFcl?fclTotal/qty:lclTotal/qty}; });
  if(!rows.length){ return; }
  const minFcl=Math.min(...rows.map(r=>r.fcl));
  const maxFcl=Math.max(...rows.map(r=>r.fcl));
  const minTime=Math.min(...rows.map(r=>r.c.days));
  const best=rows.find(r=>r.fcl===minFcl);
  const fastest=rows.find(r=>r.c.days===minTime);
  const risk=rows.filter(r=>r.c.days>(req.days||25));
  const slotC=carriers.find(c=>/保舱/.test(c.slot||''));
  const sceneLabel=req.scene||'日常';
  const verdict=best.c;
  const reasons=[];
  reasons.push('FCL 总价最低：$'+best.fcl.toLocaleString()+(best.c.name===fastest.c.name?'，时效也最快 '+fastest.c.days+' 天':'（最高省 $'+(maxFcl-best.fcl).toLocaleString()+'）'));
  if(verdict.days<=(req.days||25)) reasons.push(verdict.days+' 天到港，满足 ≤'+(req.days||25)+' 天目标');
  reasons.push('配合 AWD：月持有成本省约 56%，长期仓储省约 80%');
  if(sceneLabel==='旺季' && slotC && slotC.id!==verdict.id){
    reasons.push('旺季提示：['+slotC.name+'] 有保舱协议，可作旺季首选');
  }
  document.getElementById('aiV4').innerHTML='<div class="ai-v-icon">✓</div><div class="ai-v-txt"><div class="ai-v-title">建议本批走 <b>'+verdict.name+'</b> · '+(useFcl?'FCL '+nCont+'×40HQ':'LCL')+'</div><div class="ai-v-sub">'+sceneLabel+'场景 · FCL 总价 $'+best.fcl.toLocaleString()+' · '+verdict.days+' 天 · 目标 ≤'+(req.days||25)+' 天</div></div>';
  document.getElementById('aiR4').innerHTML='<div class="ai-r-label">理由</div><div class="ai-r-tags">'+reasons.map(r=>'<span>'+r+'</span>').join('')+'</div>';
  document.getElementById('aiK4').innerHTML=risk.length?('<div class="ai-k-warn">⚠ 风险提示：['+risk.map(r=>r.c.name).join('、')+'] 时效超目标（'+risk.map(r=>r.c.days+'天').join(' / ')+'），不建议优先</div>'):'<div class="ai-k-ok">✓ 无时效风险：所有候选均满足 ≤'+(req.days||25)+' 天目标</div>';
  document.getElementById('aiB4').innerHTML='AI 依据：本批 '+qty.toLocaleString()+' 台 · '+vol.toFixed(0)+' CBM · '+(useFcl?'FCL '+nCont+'×40HQ':'LCL')+' · 数据与 P3 报价、P2 需求实时同步 · 结论仅供参考，最终由你确认';
})();


function switchLine(line){
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.line===line));
  document.getElementById('cnUs').classList.toggle('hidden',line!=='CN-US');
  document.getElementById('vnUs').classList.toggle('hidden',line!=='VN-US');
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
</script>
</body>
</html>

        else location.href = h + (h.indexOf('?')>-1?'&':'?') + 'embed=1';
      }
    });
  }
  if(document.body){ init(); } else { document.addEventListener('DOMContentLoaded', init); }
})();
</script>

<script>
const WEIGHTS = {
  日常:{price:30, time:25, slot:15, customs:10, claims:10, rep:10},
  旺季:{price:20, time:15, slot:40, customs:10, claims:5, rep:10},
  应急:{price:20, time:30, slot:30, customs:10, claims:5, rep:5}
};
const DEFAULTS = [
  {id:'A', name:'货代A', fcl:2400, days:21, customs:'单清（包税）', slot:'常规订舱', claims:'按货值全赔', rep:4},
  {id:'B', name:'货代B', fcl:2600, days:24, customs:'单清（不包税）', slot:'旺季保舱（协议）', claims:'最高赔$200/件', rep:4},
  {id:'C', name:'货代C', fcl:2800, days:26, customs:'单清（包税）', slot:'旺季可能甩柜', claims:'按货值80%赔', rep:5}
];
const MAPPINGS = {
  customs:[['双清包税',5],['单清（包税）',4],['单清（不包税）',3],['仅清关（需自清）',2]],
  slot:[['旺季保舱（协议）',5],['常规订舱',4],['旺季可能甩柜',3]],
  claims:[['按货值全赔',5],['按货值80%赔',4],['最高赔$200/件',3],['按运费3倍赔',2]]
};
const DIM_NAME = {price:'价格', time:'时效', slot:'舱位保障', customs:'清关能力', claims:'保障理赔', rep:'履约口碑'};
const DIM_WEIGHT_KEY = {price:'price', time:'time', slot:'slot', customs:'customs', claims:'claims', rep:'rep'};
const SLIDERS=['price','time','slot','customs','claims','rep'];

let scene='日常', scoreView=false, custom=null, selected=null, excluded={}, exempted={};
let CARRIERS={}, REQ={qty:2000, port:'洛杉矶 / 长滩', days:25};

function rateOf(dim, attr){ const p=MAPPINGS[dim].find(m=>m[0]===attr); return p ? p[1] : 3; }

function loadAll(){
  try{ const r=localStorage.getItem('lianyun_request'); if(r){ REQ=Object.assign(REQ, JSON.parse(r)); if(REQ.scene) scene=REQ.scene; } }catch(e){}
  let list=null;
  try{ const d=localStorage.getItem('lianyun_carriers'); if(d){ const arr=JSON.parse(d); if(Array.isArray(arr)&&arr.length) list=arr; } }catch(e){}
  if(!list) list=DEFAULTS;
  list=list.filter(c=>c.lcl && c.fcl && c.days && c.customs && c.slot && c.claims && c.rep);
  if(!list.length) list=DEFAULTS;
  const minPrice=Math.min(...list.map(c=>c.fcl));
  const minTime=Math.min(...list.map(c=>c.days));
  CARRIERS={};
  list.forEach(c=>{
    CARRIERS[c.id]={ id:c.id, name:c.name,
      price:{label:'$'+c.fcl.toLocaleString(), sub:'$'+c.fcl.toLocaleString()+'/柜', s100:Math.round(minPrice/c.fcl*100)},
      time:{label:c.days+'天', note:(c.days===minTime?'最快':''), s100:Math.round(minTime/c.days*100), warn:c.days>REQ.days},
      customs:{attr:c.customs, rate:rateOf('customs',c.customs)},
      slot:{attr:c.slot, rate:rateOf('slot',c.slot)},
      claims:{attr:c.claims, rate:rateOf('claims',c.claims)},
      rep:{rate:Number(c.rep)||4, note:'历史评分'}
    };
  });
  selected=Object.keys(CARRIERS).sort((a,b)=>rank(b)-rank(a))[0]||Object.keys(CARRIERS)[0];
}
loadAll();
document.querySelector('.ctx').textContent='需求 #REQ-2608-001 ('+(REQ.sku||'C28')+') · CN-US · '+(REQ.qty||2000).toLocaleString()+' 台 · '+REQ.port+' · 目标 ≤'+(REQ.days||25)+' 天';
document.querySelectorAll('#sceneSeg button').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene));

function w(){ return custom || WEIGHTS[scene]; }
function dimS100(c, d){ const o=CARRIERS[c][d]; return o.s100 !== undefined ? o.s100 : o.rate*20; }
function total(c){
  const W=w(), o=CARRIERS[c];
  return (o.price.s100*W.price + o.time.s100*W.time + o.slot.rate*20*W.slot + o.customs.rate*20*W.customs + o.claims.rate*20*W.claims + o.rep.rate*20*W.rep)/100;
}
function stars(t){ return t>=90?'★★★★★':t>=80?'★★★★☆':t>=70?'★★★☆☆':t>=60?'★★☆☆☆':'★☆☆☆☆'; }
function rank(c){ return excluded[c]?99:total(c); }
function ids(){ return Object.keys(CARRIERS).filter(x=>!excluded[x]).sort((a,b)=>rank(b)-rank(a)); }
function riskId(){ const k=Object.keys(CARRIERS).find(x=>!excluded[x]&&CARRIERS[x].time.warn); return k||null; }
function slotCarrierId(){ return Object.keys(CARRIERS).find(x=>CARRIERS[x].slot.attr==='旺季保舱（协议）')||null; }

function render(){
  const order=ids();
  const tbody=document.getElementById('cmpBody');
  let html='';
  order.forEach((c,i)=>{
    const o=CARRIERS[c]; const t=total(c);
    const sel=selected===c, isFirst=i===0, exempt=exempted[c];
    const timeWarn=o.time.warn && !exempt;
    html+='<tr data-id="'+c+'" class="'+(excluded[c]?'excluded':'')+'" onclick="pick(\''+c+'\')">'
      +'<td><span class="radio'+(sel?' sel':'')+'" onclick="event.stopPropagation();pick(\''+c+'\')"></span></td>'
      +'<td><div class="cname">'+(isFirst?'<span class="star">★ </span>':'')+o.name+(isFirst?'<span class="badge">综合最优</span>':'')+'</div><div class="cell-sub">'+(excluded[c]?'已排除':'')+'</div></td>'
      +'<td style="text-align:right;"><div class="cell-main">'+o.price.label+'</div><div class="cell-sub">'+o.price.sub+'</div>'
      +'<div class="score-link" onclick="event.stopPropagation();openCalc(\''+c+'\',\'price\')">'+(scoreView?o.price.s100+'分':'')+' ▸</div></td>'
      +'<td><div class="cell-main'+(timeWarn?' warn':'')+'">'+o.time.label+(timeWarn?' ⚠':'')+'</div><div class="cell-sub">'+o.time.note+'</div>'
      +'<div class="score-link" onclick="event.stopPropagation();openCalc(\''+c+'\',\'time\')">'+(scoreView?o.time.s100+'分':'')+' ▸</div></td>'
      +attrCell(c,'customs')+attrCell(c,'slot')+attrCell(c,'claims')
      +'<td><div class="cell-main">'+(o.rep.rate||'-')+'.0</div><div class="cell-sub">'+o.rep.note+'</div>'
      +'<div class="score-link" onclick="event.stopPropagation();openCalc(\''+c+'\',\'rep\')">'+(scoreView?o.rep.rate*20+'分':'')+' ▸</div></td>'
      +'<td style="text-align:right;"><div class="total'+(isFirst?' first':'')+'">'+t.toFixed(1)+'</div><div class="stars">'+stars(t)+'</div>'
      +'<div class="score-link" onclick="event.stopPropagation();openScoreCard()">评分卡 ▸</div></td>'
      +'</tr>';
  });
  tbody.innerHTML=html;
  const o=CARRIERS[selected];
  document.getElementById('selSummary').innerHTML='已选：<b>'+o.name+'</b> · FCL · 海运费 '+o.price.label+' · 预计到港 '+o.time.label;
  document.getElementById('confirmBtn').textContent='确认选择 '+o.name;
  renderDiag(order);
}
function attrCell(c,d){
  const o=CARRIERS[c][d];
  const v=scoreView?(o.rate+'/5 · '+o.rate*20+'分'):o.attr;
  return '<td><div class="attr">'+v+'</div><div class="score-link" onclick="event.stopPropagation();openCalc(\''+c+'\',\''+d+'\')">'+o.rate+'分 ▸</div></td>';
}
function renderDiag(order){
  const W=w();
  const sceneLabel=custom?'自定义':scene;
  if(!order.length){
    document.getElementById('aiVerdict').innerHTML='<div class="ai-v-txt"><div class="ai-v-title">无合格候选</div><div class="ai-v-sub">请回 P3 补全报价后重新评分</div></div>';
    document.getElementById('aiReasons').innerHTML='';
    document.getElementById('diagRisk').innerHTML='';
    document.getElementById('diagAlt').innerHTML='';
    document.getElementById('aiBasis').innerHTML='';
    return;
  }
  const first=order[0], o=CARRIERS[first], t=total(first);
  const all=Object.keys(CARRIERS).filter(x=>!excluded[x]);
  // AI 结论
  document.getElementById('aiVerdict').innerHTML=
    '<div class="ai-v-icon">✓</div><div class="ai-v-txt">'
    +'<div class="ai-v-title">推荐 <b>'+o.name+'</b> <span class="ai-score">'+t.toFixed(1)+' 分</span></div>'
    +'<div class="ai-v-sub">'+sceneLabel+'场景 · 六维加权综合最优'+(o.time.warn?'，但存在时效风险（可豁免/排除）':'，满足 ≤'+REQ.days+' 天时效目标')+'</div>'
    +'</div>';
  // 理由要点（随场景/权重变化）
  const reasons=[];
  const minP=Math.min(...all.map(x=>CARRIERS[x].price.s100));
  const maxT=Math.max(...all.map(x=>CARRIERS[x].time.s100));
  if(o.price.s100===minP) reasons.push('价格最优 · '+o.price.sub);
  if(o.time.s100===maxT) reasons.push('时效最优 · '+o.time.label);
  if(!o.time.warn) reasons.push('满足 ≤'+REQ.days+' 天目标');
  if(scene==='旺季' && o.slot.rate>=4) reasons.push('舱位 A 级 · 旺季关键维度');
  if(o.rep.rate>=4.5) reasons.push('口碑领先 · '+o.rep.rate.toFixed(1)+'/5');
  if(reasons.length<2) reasons.push('综合领先次优 '+(all.length>1?(t-total(order[1])).toFixed(1):0)+' 分');
  document.getElementById('aiReasons').innerHTML='<div class="ai-r-label">理由</div><div class="ai-r-tags">'+reasons.map(r=>'<span>'+r+'</span>').join('')+'</div>';
  // 风险（保留原交互：豁免/排除留痕）
  const rid=riskId();
  if(rid){
    const ro=CARRIERS[rid];
    if(exempted[rid]){
      document.getElementById('diagRisk').innerHTML='<span>已豁免 ['+ro.name+'] 超时效目标（留痕）</span><button class="act-btn ghost" onclick="unexempt(\''+rid+'\')">撤销豁免</button>';
    }else{
      document.getElementById('diagRisk').innerHTML='<span class="warn-flag">⚠ 风险：['+ro.name+'] 时效 '+ro.time.label+' 超目标 ≤'+REQ.days+' 天</span><button class="act-btn danger-soft" onclick="exempt(\''+rid+'\')">允许豁免</button><button class="act-btn ghost" onclick="exclude(\''+rid+'\')">排除候选</button>';
    }
  }else{
    document.getElementById('diagRisk').innerHTML='<span class="exempt-note">✓ 无时效风险：所有候选均满足 ≤'+(REQ.days||25)+' 天目标</span>';
  }
  // 备选 / 场景建议
  const sid=slotCarrierId();
  if(scene==='旺季'){
    document.getElementById('diagAlt').innerHTML='<span>当前已是旺季场景（舱位权重 40%）</span><button class="act-btn ghost" onclick="setScene(\'日常\')">切回日常</button>';
  }else if(sid && !excluded[sid]){
    document.getElementById('diagAlt').innerHTML='<span>★ 备选：['+CARRIERS[sid].name+'] 舱位 A+（旺季保舱协议）</span><button class="act-btn primary" onclick="setScene(\'旺季\')">切到旺季比较</button>';
  }else{
    document.getElementById('diagAlt').innerHTML='';
  }
  // 依据（可解释性）
  document.getElementById('aiBasis').innerHTML='AI 依据：权重 '+['价格 '+W.price+'%','时效 '+W.time+'%','舱位 '+W.slot+'%','清关 '+W.customs+'%','理赔 '+W.claims+'%','口碑 '+W.rep+'%'].join(' · ')+' ＋ 真实报价对比 · 切换场景可查看结论变化';
}
function pick(c){ if(!excluded[c]){ selected=c; render(); } }
function setScene(s){ scene=s; custom=null; document.querySelectorAll('#sceneSeg button').forEach(b=>b.classList.toggle('active',b.dataset.scene===s)); render(); }
function exempt(id){ exempted[id]=true; render(); toast('已豁免 '+CARRIERS[id].name+' 超目标，动作已留痕'); }
function unexempt(id){ exempted[id]=false; render(); }
function exclude(id){ excluded[id]=true; if(selected===id) selected=ids()[0]||null; render(); toast('已排除 '+CARRIERS[id].name+'，排名已重算'); }
function toggleView(){ scoreView=!scoreView; document.getElementById('viewSwitch').classList.toggle('on',scoreView); render(); }

function openCalc(c,d){
  const W=w(), o=CARRIERS[c];
  const dimKey=DIM_WEIGHT_KEY[d], wPct=W[dimKey], s100=dimS100(c,d), contrib=(s100*wPct/100).toFixed(1);
  document.getElementById('calcTitle').textContent=o.name+' · '+DIM_NAME[d];
  let html='<div class="k-row"><span class="k-label">维度与权重</span><span class="k-val">'+DIM_NAME[d]+' · '+wPct+'%</span></div>';
  if(d==='price'||d==='time'){
    const raw=o[d].label+(o[d].sub?'（'+o[d].sub+'）':'');
    const basis=d==='price'?'最低价归一':'最快归一';
    html+='<div class="k-row"><span class="k-label">原始值</span><span class="k-val">'+raw+'</span></div>'
      +'<div class="k-row"><span class="k-label">归一公式</span><span class="k-val">'+basis+' → '+s100+'分</span></div>';
  }else{
    const map=MAPPINGS[d];
    html+='<div class="k-row"><span class="k-label">业务属性</span><span class="k-val">'+o[d].attr+'</span></div>'
      +'<div class="k-row"><span class="k-label">属性映射</span><span class="k-val">'+o[d].attr+' → '+o[d].rate+'/5 → '+s100+'分</span></div>'
      +'<div class="mapping">映射规则：'+map.map(m=>'<b>'+m[0]+' = '+m[1]+'分</b>').join(' · ')+'</div>';
  }
  html+='<div class="k-row" style="border-top:1px solid var(--line); margin-top:10px;"><span class="k-label">加权贡献</span><span class="k-val">'+s100+' × '+wPct+'% = <b>'+contrib+' 分</b></span></div>';
  document.getElementById('calcBody').innerHTML=html;
  openDrawer('calcDrawer');
}
function openScoreCard(){
  const W=w(), order=ids(), dims=['price','time','slot','customs','claims','rep'];
  let html='<table><thead><tr><th>维度</th><th>权重</th>'+order.map(c=>'<th style="text-align:right;">'+CARRIERS[c].name+'</th>').join('')+'</tr></thead><tbody>';
  dims.forEach(d=>{

  const vals={}; let sum=SLIDERS.reduce((s,k)=>{const v=parseInt(document.getElementById('wv-'+k).textContent); vals[k]=v; return s+v;},0);
  if(sum===0){ toast('权重不能全为 0'); return; }
  let rem=100; SLIDERS.forEach(k=>{ const v=Math.round(vals[k]*100/sum); vals[k]=v; rem-=v; });

  SLIDERS.forEach(k=>{ document.getElementById('wv-'+k).textContent=vals[k]+'%'; document.querySelector('input[data-k="'+k+'"]').value=vals[k]; });

<script>
let status='draft', lastBatchId='BATCH-2608-004';
const pills={draft:'stDraft',pending:'stPending',done:'stDone',revise:'stRevise'};
const CLAIMS_MAP={ '按货值全赔':'按货值全赔','按货值80%赔':'按货值80%赔','最高赔$200/件':'最高赔$200/件','按运费3倍赔':'按运费3倍赔' };

function loadReq(){ try{ const d=localStorage.getItem('lianyun_request'); return d?JSON.parse(d):{}; }catch(e){ return {}; } }
function loadSel(){ try{ const d=localStorage.getItem('lianyun_selected'); return d?JSON.parse(d):null; }catch(e){ return null; } }
function fmtDate(base, addDays){
  const d=new Date(base); d.setDate(d.getDate()+addDays);
  return (d.getMonth()+1)+'/'+d.getDate();
}
function fillSO(){
  const req=loadReq(), sel=loadSel();
  const qty=sel?sel.qty:(req.qty||2000);
  const nCont=sel?sel.nCont:Math.ceil(qty*0.12/68);
  const fcl=sel?sel.fcl:2400;
  const days=sel?sel.days:21;
  const name=sel?sel.name:'货代A';
  const vol=qty*0.12;
  const etd=fmtDate(new Date('2026-08-24'),0), eta=fmtDate(new Date('2026-08-24'),days), cutoff=fmtDate(new Date('2026-08-24'),-2);
  const freight=fcl*nCont, thc=nCont*120, total=freight+50+thc;
  document.getElementById('soCtx').textContent='SO-2608-001 · 需求 #REQ-2608-001 · '+name+' · CN-US';
  document.getElementById('soCutoff').textContent=cutoff+' 17:00';
  document.getElementById('soEtd').textContent=etd;
  document.getElementById('soEta').textContent=eta;
  document.getElementById('soPort').textContent=sel?sel.port.split('（')[0]:'洛杉矶';

/* ===== 高级感 v2：全页组件统一精修 ===== */

/* 标题体系：更通透的字距与对比 */

/* 状态胶囊：更清晰的语义 */

function loadCarriers(){
  let list=null;

  if(!list) list=[{id:'A',name:'货代A',customs:'单清（包税）',slot:'常规订舱',claims:'按货值全赔'},{id:'B',name:'货代B',customs:'单清（不包税）',slot:'旺季保舱（协议）',claims:'最高赔$200/件'},{id:'C',name:'货代C',customs:'单清（包税）',slot:'旺季可能甩柜',claims:'按货值80%赔'}];

    if(hist.length){

<script>
var PAGES = [
  { "id": "p1", "file": "P1-工作台-原型.html", "name": "工作台", "desc": "风险与待办" },

  { "id": "p7", "file": "P7-运输监控-原型.html", "name": "运输监控", "desc": "时效与风险" },
  { "id": "p8", "file": "P8-库存看板-原型.html", "name": "库存看板", "desc": "在途与呆滞" },
  { "id": "p9", "file": "P9-货代档案-原型.html", "name": "货代档案", "desc": "口碑沉淀" }
];
var current = "p1";
var frame = document.getElementById("frame");
var crumbPage = document.getElementById("crumbPage");

function setPage(id) {
  var t = document.getElementById("tmpl-" + id);
  if (!t) return false;
  frame.srcdoc = t.innerHTML;
  return true;
}

function go(id) {
  var p = null;
  for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === id) { p = PAGES[i]; break; }
  if (!p || id === current) return;
  current = id;
  var items = document.querySelectorAll(".nav-item");
  for (var j = 0; j < items.length; j++) items[j].classList.toggle("active", items[j].getAttribute("data-id") === id);
  crumbPage.textContent = p.name;
  document.title = p.name + " · 链运 SCM";
  document.getElementById("loading").classList.add("show");
  setPage(id);
  try { location.hash = id; } catch (e) {}
}

window.addEventListener("hashchange", function() {
  var h = (location.hash || "").replace("#", "");
  if (h && h !== current) go(h);
});

/* 供内嵌页面调用：内部跳转统一由外壳接管 */
window.shellGo = function(href) {
  var base = href.split("?")[0].split("/").pop();
  for (var i = 0; i < PAGES.length; i++) if (PAGES[i].file === base) { go(PAGES[i].id); return; }
};

function toggleNav() {
  document.querySelector(".sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}
function closeNav() {
  document.querySelector(".sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}
document.querySelectorAll(".nav-item").forEach(function(a) {
  a.addEventListener("click", function(e) {
    e.preventDefault(); go(a.getAttribute("data-id"));
    if (window.innerWidth <= 860) closeNav();
  });
});

function resetAll() {
  ["lianyun_carriers","lianyun_request","lianyun_selected","lianyun_batch","lianyun_batch_seq","lianyun_ratings"]
    .forEach(function(k) { try { localStorage.removeItem(k); } catch (e) {} });
  document.getElementById("loading").classList.add("show");
  setPage(current);
}

frame.addEventListener("load", function() {
  document.getElementById("loading").classList.remove("show");
});

document.addEventListener("keydown", function(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  var idx = parseInt(e.key, 10);
  if (idx >= 1 && idx <= PAGES.length) go(PAGES[idx - 1].id);
});

/* 初始加载：支持 #p1-#p9 深链（当前页默认为 p1，需直接 setPage，避免 go() 短路） */
(function(){
  var h = (location.hash || "").replace("#", "");
  var target = "p1";
  for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === h) { target = h; break; }
  if (target === "p1") { setPage("p1"); } else { go(target); }
})();
</script>
